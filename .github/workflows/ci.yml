name: Build and acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offscreen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install Qt build and fixture modules
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config python3 qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript fonts-dejavu-core
      - name: Record runtime versions
        run: |
          python3 --version
          node --version
          if pkg-config --exists Qt6Quick; then pkg-config --modversion Qt6Quick; else qmake6 -query QT_VERSION; fi
      - name: Build and test real offscreen consumers and MCP
        run: make check
      - name: Check OpenCode reminder hooks
        run: node tests/hooks.mjs
